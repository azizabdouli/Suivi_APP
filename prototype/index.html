 $('#tree').innerHTML=`<ul>${nd({key:'tb',l:0,ico:'tb',label:'Tableau de bord',href:'#tableau',on:VIEW==='tableau'})}</ul><p class="sh">Portefeuille</p><ul>`+
 nd({key:'cl',l:0,ico:'cl',label:'Clients',href:'#clients',n:D.cl.length,on:VIEW==='clients'||VIEW==='client',kids:()=>cls.map(c=>nd({key:'c:'+c.id,l:1,label:c.nom,shown:tc(c.nom),href:'#client-'+c.id,n:A.cc.get(c.id)||0,on:h==='client-'+c.id,kids:()=>D.ct.filter(k=>k.cl===c.id).map(k=>nd({key:'k:'+k.id,l:2,label:(k.nature||'Contrat')+' · '+k.police,shown:cap(br(k))+' · '+k.police,href:'#client-'+c.id,focus:'ct-'+k.id,n:A.kd.get(k.id)?.[0]||0,kids:()=>D.dc.filter(d=>d.ct===k.id).map(d=>nd({key:'d:'+d.id,l:3,label:cap(d.type)+(d.avenant?' n° '+d.avenant:'')+' · '+cap(d.doc),href:'#client-'+c.id,focus:'doc-'+d.id,dot:STEPS[d.etape]?.[1]})).join('')})).join('')})).join('')})+
 nd({key:'ct',l:0,ico:'av',label:'Documents',href:'#documents',n:D.dc.length,on:VIEW==='documents',kids:()=>Object.keys(nat).sort().map(n=>nd({key:'n:'+n,l:1,label:n,shown:cap(n),href:'#contrats',nav:'contrats:'+n,n:nat[n],on:VIEW==='contrats'&&Fn===n}))})+
 nd({key:'av',skip:1,l:0,ico:'av',label:'Avenants',href:'#avenants',n:D.dc.filter(isAv).length,on:VIEW==='avenants'&&Fe===null,kids:()=>STEPS.map((s,i)=>nd({key:'e:'+i,l:1,label:i+' · '+s[0],href:'#avenants-'+i,n:cnt[i],dot:s[1],on:VIEW==='avenants'&&Fe===i}))})+'</ul>'}
$('#side').onclick=e=>{const tg=e.target.closest('[data-tg]');if(tg){const k=tg.dataset.tg;OPEN.has(k)?OPEN.delete(k):OPEN.add(k);return renderTree()}
 const a=e.target.closest('a');if(!a)return;const nv=a.dataset.nav||'';
 if(nv.startsWith('contrats:'))Fn=nv.slice(9);else if(nv==='contrats')Fn='';

$('#burger').onclick=()=>document.body.classList.add('menu');$('#scrim').onclick=()=>document.body.classList.remove('menu');

/* Formulaires */
const FORMS={cl:[['nom','Nom de l’assuré','','w',1],['code','Code assuré'],['contact','Contact','']],
 ct:[['cl','Client','cl','w'],['police','N° de police','','',1],['nature','Branche','list:nat'],['compagnie','Compagnie','list:comp'],['lieu','Fronté ou local','sel:LOCAL,FRONTE'],['etape','Étape du contrat','step','w']],
 dc:[['ct','Contrat','ct','w'],['type','Type','sel:AVENANT,CONTRAT,NOTE DE COUVERTURE,CONTRAT DE MARCHE,CAUTION DEFINITIVE'],['doc','Objet de l’avenant','list:doc'],['avenant','N° d’avenant'],['effet','Date d’effet','date'],['etape','Étape','step','w'],['remarque','Remarque','area','w']]};
FORMS.dc=[['type','Type de document','sel:CONTRAT,AVENANT','w'],['dateEtape','Date de l’étape','date'],['etape','Étape','step'],['assure','Assuré','list:cl','w',1],['code','Code assuré'],['police','N° de police'],['nature','Nature police','list:nat'],['compagnie','Compagnie','list:comp'],['effet','Date d’effet','date'],['doc','Nature document','list:doc'],['avenant','N° avenant'],['lieu','Fronté / Local','sel:LOCAL,FRONTE'],['remarque','Remarque chargé','area','w']];
const isAv=d=>d.type==='AVENANT',today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10),clean=()=>{D.ct=D.ct.filter(k=>D.dc.some(d=>d.ct===k.id))};
function field([n,l,t,w,req],v,A){let i;t=t||'';
 if(t==='area')i=`<textarea name="${n}" rows="2">${esc(v)}</textarea>`;
 else if(t==='step')i=`<select name="${n}">${STEPS.map((s,j)=>`<option value="${j}"${j==v?' selected':''}>${j} · ${s[0]}</option>`).join('')}</select>`;
 else if(t==='cl'||t==='ct'){const L=t==='cl'?D.cl.map(c=>[c.id,c.nom]):D.ct.map(k=>[k.id,(A.C.get(k.cl)?.nom||'')+' — '+k.police]);i=`<select name="${n}" required>${L.map(([x,y])=>`<option value="${x}"${x===v?' selected':''}>${esc(y)}</option>`).join('')}</select>`}
 else if(t.startsWith('sel:'))i=`<select name="${n}">${t.slice(4).split(',').map(o=>`<option${o===v?' selected':''}>${o}</option>`).join('')}</select>`;
 else i=`<input name="${n}" value="${esc(v)}"${t.startsWith('list:')?` list="dl-${t.slice(5)}"`:t==='date'?' type="date"':''}${req?' required':''}>`;
 return `<label class="${w||''}">${l}${i}</label>`}
function openClient(id){ED={kind:'cl',id};const c=id?D.cl.find(x=>x.id===id):{};$('#dt').textContent=id?'Modifier le client':'Nouveau client';$('#gf').innerHTML=FORMS.cl.map(f=>field(f,c[f[0]]??'',null)).join('');$('#del').hidden=!id;$('#dlg').showModal()}
function openForm(kind,id,parent){const A=agg();ED={kind:'dc',id};kind='dc';
 const d0=id&&D.dc.find(x=>x.id===id),k0=d0?A.K.get(d0.ct):parent&&parent[0]==='k'?A.K.get(parent):null,c0=k0?A.C.get(k0.cl):parent&&parent[0]==='c'?A.C.get(parent):null,rec={lieu:'LOCAL',type:'AVENANT',etape:0,dateEtape:today(),...(k0?{police:k0.police,nature:k0.nature,compagnie:k0.compagnie,lieu:k0.lieu}:{}),...(c0?{assure:c0.nom,code:c0.code}:{}),...(d0||{})};
 $('#dt').textContent=id?'Modifier le document':'Ajouter un document';
 $('#gf').innerHTML=FORMS.dc.map(f=>field(f[0]==='type'?['type','Type de document','sel:CONTRAT,AVENANT'+(['CONTRAT','AVENANT'].includes(rec.type)?'':','+rec.type),'w']:f,rec[f[0]]??'',A)).join('');$('#del').hidden=!id;
 const ts=$('#gf [name=type]'),hid=['avenant','doc'].map(n=>$(`#gf [name=${n}]`).closest('label')),sync=cl=>{const c=ts.value==='CONTRAT';hid.forEach(l=>{l.style.display=c?'none':'';if(c&&cl)l.querySelector('input').value=''})};ts.onchange=()=>sync(true);sync(false);
 $('#gf [name=etape]').onchange=()=>{$('#gf [name=dateEtape]').value=today()};$('#dlg').showModal()}
$('#cancel').onclick=()=>$('#dlg').close();
$('#fm').onsubmit=e=>{const o=Object.fromEntries(new FormData($('#fm')));for(const k in o)o[k]=String(o[k]).trim();if('etape' in o)o.etape=+o.etape;
 if(ED.kind==='cl'){if(D.cl.some(x=>x.nom.toUpperCase()===o.nom.toUpperCase()&&x.id!==ED.id)){e.preventDefault();return toast('Ce client existe déjà')}snap();if(ED.id)Object.assign(D.cl.find(x=>x.id===ED.id),o);else D.cl.unshift({id:'c'+Date.now(),...o});save();refresh();return toast('Client enregistré',undo)}
 snap();const cn=o.assure.toUpperCase();let c=D.cl.find(x=>x.nom.toUpperCase()===cn);
 if(!c){c={id:'c'+Date.now(),code:o.code,nom:o.assure,contact:''};D.cl.unshift(c)}else if(o.code)c.code=o.code;
 let k=D.ct.find(x=>x.cl===c.id&&x.police===o.police);const kv={nature:o.nature,compagnie:o.compagnie,lieu:o.lieu};
 if(k)Object.assign(k,kv);else{k={id:'k'+Date.now(),cl:c.id,police:o.police,...kv};D.ct.unshift(k)}
 const dd={ct:k.id,type:o.type,doc:o.doc,avenant:o.avenant,effet:o.effet,etape:+o.etape,dateEtape:o.dateEtape,remarque:o.remarque};
 if(ED.id)Object.assign(D.dc.find(x=>x.id===ED.id),dd);else D.dc.unshift({id:'d'+Date.now(),...dd});clean();save();refresh();toast('Enregistré',undo)};
$('#del').onclick=()=>{snap();const{kind,id}=ED;D[kind]=D[kind].filter(x=>x.id!==id);
 if(kind==='cl'){const ks=D.ct.filter(k=>k.cl===id).map(k=>k.id);D.ct=D.ct.filter(k=>k.cl!==id);D.dc=D.dc.filter(d=>!ks.includes(d.ct))}
 clean();save();$('#dlg').close();if(kind==='cl'&&VIEW==='client')location.hash='clients';else refresh();toast(kind==='cl'?'Client supprimé avec ses contrats et documents':'Document supprimé',undo)};

/* Événements */
$('#app').onclick=e=>{const g=s=>e.target.closest(s);let x;if(g('select'))return;
 if(x=g('[data-newcl]'))return openClient(null);
 if(x=g('[data-editcl]'))return openClient(x.dataset.editcl);
 if(x=g('[data-del]')){snap();D.dc=D.dc.filter(d=>d.id!==x.dataset.del);clean();save();if(VIEW==='client'&&!D.cl.some(c=>'client-'+c.id===location.hash.slice(1)))location.hash='clients';else refresh();return toast('Document supprimé',undo)}
 if(x=g('[data-next]')){snap();const[k,i]=x.dataset.next.split(':'),d=D[k].find(y=>y.id===i);d.etape=Math.min(6,d.etape+1);if(k==='dc')d.dateEtape=today();save();refresh();return toast('Passé à l’étape '+d.etape,undo)}
 if(x=g('[data-add]')){const[k,p]=x.dataset.add.split(':');return openForm(k,null,p)}
 if(x=g('[data-edit]')){const[k,i]=x.dataset.edit.split(':');return openForm(k,i)}
 if(x=g('[data-e]')){const n=+x.dataset.e;lim=100;return location.hash=VIEW==='documents'&&Fe===n?'documents':'documents-'+n}
 if(x=g('th[data-k]')){S=S.k===x.dataset.k?{k:S.k,d:-S.d}:{k:x.dataset.k,d:1};return suiviBody()}
 if(g('#more')){lim+=200;return suiviBody()}
 if(g('#clr')||g('[data-clear]'))return clearF();
 if(x=g('[data-doc]'))return openForm('dc',x.dataset.doc);
 if(x=g('[data-go]'))location.hash=x.dataset.go};
$('#app').onchange=e=>{const t=e.target,s=t.closest('select[data-id]');
 if(s){if(s.value==='')return;snap();const r=D[s.dataset.k].find(d=>d.id===s.dataset.id);r.etape=+s.value;if(s.dataset.k==='dc')r.dateEtape=today();save();refresh();return toast('Étape mise à jour',undo)}
 if(t.id==='fn'){Fn=t.value;lim=100;suiviBody();return renderTree()}if(t.id==='fc')Fc=t.value;else if(t.id==='ft')Ft=t.value;else if(t.id==='fl')Fl=t.value;else return;lim=100;suiviBody()};
$('#app').oninput=e=>{if(e.target.id==='q'){Q=e.target.value;lim=100;body()}};
$('#app').onkeydown=e=>{if(e.key==='Enter'&&e.target.matches('th[data-k]'))e.target.click()};
addEventListener('keydown',e=>{if(e.key==='/'&&$('#q')&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();$('#q').focus()}});
$('#impl').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('#imp').click()}};

/* Import Excel : regroupe les lignes en clients, contrats et documents */
const norm=s=>String(s).replace(/[’‘]/g,"'").replace(/\s+/g,' ').trim().toUpperCase();
function iso(v){if(v instanceof Date&&!isNaN(v)){const d=new Date(v.getTime()+12*36e5);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}return/^\d{4}-\d{2}-\d{2}/.test(v)?String(v).slice(0,10):''}
$('#imp').onchange=async e=>{const file=e.target.files[0];if(!file)return;
 try{const wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true}),ws=wb.Sheets['ETAT']||wb.Sheets[wb.SheetNames[0]],cl=new Map(),ct=new Map(),dc=[];
  XLSX.utils.sheet_to_json(ws,{defval:''}).forEach((raw,i)=>{const r={};for(const k in raw)r[norm(k)]=raw[k];const t=k=>String(r[k]??'').trim(),nom=t('ASSURE');if(!nom)return;
   const ck=nom.toUpperCase();let c=cl.get(ck);if(!c){c={id:'c'+cl.size,code:t('CODE ASSURE'),nom,contact:''};cl.set(ck,c)}else if(!c.code)c.code=t('CODE ASSURE');
   const kk=ck+'|'+t('N° DE POLICE');let k=ct.get(kk);if(!k){k={id:'k'+ct.size,cl:c.id,police:t('N° DE POLICE'),nature:t('NATURE POLICE'),compagnie:t('COMPAGNIE'),lieu:t('FRONTE / LOCAL'),etape:null};ct.set(kk,k)}
   const n=parseInt(r['ETAPE']);if(t("L'AVENANT/CONTRAT").toUpperCase()==='CONTRAT'&&n>=0&&n<=6)k.etape=n;dc.push({id:'d'+i,ct:k.id,type:t("L'AVENANT/CONTRAT").toUpperCase(),doc:t('NATURE DOCUMENT').toUpperCase(),avenant:t('N° AVENANT'),effet:iso(r["DATE D'EFFET"]),dateEtape:iso(r['IL']??r['L']),etape:n>=0&&n<=6?n:0,remarque:t('REMARQUE CHARGÉ')})});
  if(!dc.length)throw 0;snap();D={cl:[...cl.values()],ct:[...ct.values()],dc};save();Q='';Fc=Ft=Fl='';Fe=null;
  location.hash==='#clients'?route():location.hash='clients';toast(`${D.cl.length} clients, ${D.ct.length} contrats, ${dc.length} documents importés`,undo)
 }catch(err){toast('Import impossible : vérifiez que le fichier contient la feuille ETAT')}
 e.target.value=''};
route();
