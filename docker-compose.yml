services:
  postgres:
    image: postgres:16-alpine
    container_name: suivi-contractuel-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: suivi_contractuel
      POSTGRES_USER: suivi_app
      POSTGRES_PASSWORD: suivi_app_dev
    ports:
      - "5432:5432"
    volumes:
      - suivi_postgres_data:/var/lib/postgresql/data
volumes:
  suivi_postgres_data: